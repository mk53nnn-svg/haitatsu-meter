<title>配達メーター</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  background-color: #0a0a0f !important;
  color: #e8e8f0;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body { padding-bottom: 40px; }

.header {
background-color: #111118;
border-bottom: 1px solid #2a2a38;
padding: 52px 16px 12px;
display: -webkit-flex;
display: flex;
-webkit-align-items: center;
align-items: center;
-webkit-justify-content: space-between;
justify-content: space-between;
}
.header-title { font-size: 20px; font-weight: 800; letter-spacing: 2px; color: #00e5a0; }
.header-date { font-size: 11px; color: #5a5a72; margin-top: 2px; }

.tabs {
background-color: #111118;
border-bottom: 1px solid #2a2a38;
padding: 10px 14px;
display: -webkit-flex;
display: flex;
gap: 8px;
}
.tab {
-webkit-flex: 1;
flex: 1;
padding: 11px 4px;
text-align: center;
font-size: 13px;
font-weight: 700;
cursor: pointer;
border-radius: 10px;
border: 2px solid #2a2a38;
background-color: #0a0a0f;
color: #888899;
-webkit-appearance: none;
appearance: none;
}
.tab.active {
background-color: #00b07a;
border-color: #00b07a;
color: #ffffff;
}

.screen { display: none; padding: 14px; }
.screen.active { display: block; }

.meter-card {
background-color: #111118;
border: 1px solid #2a2a38;
border-radius: 16px;
overflow: hidden;
margin-bottom: 12px;
}
.meter-row {
display: -webkit-flex;
display: flex;
-webkit-align-items: center;
align-items: center;
padding: 14px;
border-bottom: 1px solid #2a2a38;
gap: 10px;
}
.meter-row:last-child { border-bottom: none; }
.service-dot { width: 10px; height: 10px; border-radius: 50%; -webkit-flex-shrink: 0; flex-shrink: 0; }
.service-icon { font-size: 22px; -webkit-flex-shrink: 0; flex-shrink: 0; }
.service-name { font-size: 13px; font-weight: 700; -webkit-flex: 1; flex: 1; color: #e8e8f0; }
.amount-display {
font-size: 26px; font-weight: 800;
min-width: 90px; text-align: right;
cursor: pointer; letter-spacing: -1px;
}
.amt-uber   { color: #00dd99; }
.amt-demae  { color: #ff6644; }
.amt-rocket { color: #44aaff; }

.btn-add {
background-color: #252535;
border: 1px solid #3a3a50;
border-radius: 8px;
color: #ffffff;
font-size: 20px;
font-weight: 700;
width: 36px; height: 36px;
cursor: pointer;
-webkit-flex-shrink: 0; flex-shrink: 0;
display: -webkit-flex; display: flex;
-webkit-align-items: center; align-items: center;
-webkit-justify-content: center; justify-content: center;
-webkit-appearance: none; appearance: none;
}

.total-card {
background-color: #0d1a14;
border: 2px solid #00cc88;
border-radius: 16px;
padding: 16px 18px;
margin-bottom: 12px;
}
.total-label { font-size: 11px; color: #5a5a72; letter-spacing: 2px; margin-bottom: 4px; }
.total-amount { font-size: 52px; font-weight: 800; color: #00dd99; line-height: 1; letter-spacing: -2px; }
.total-yen { font-size: 26px; font-weight: 700; color: #00dd99; margin-left: 4px; letter-spacing: 0; }

.timer-card {
background-color: #111118;
border: 1px solid #2a2a38;
border-radius: 16px;
padding: 14px;
margin-bottom: 12px;
}
.timer-header {
display: -webkit-flex; display: flex;
-webkit-justify-content: space-between; justify-content: space-between;
-webkit-align-items: center; align-items: center;
margin-bottom: 10px;
}
.timer-label { font-size: 11px; color: #5a5a72; letter-spacing: 2px; text-transform: uppercase; }
.timer-badge {
font-size: 11px; font-weight: 700;
padding: 3px 10px; border-radius: 20px; letter-spacing: 1px;
}
.badge-stopped { background-color: #222230; color: #666680; }
.badge-running { background-color: #003a26; color: #00dd99; }
.badge-paused  { background-color: #3a1a0a; color: #ff7744; }

.timer-display {
font-size: 46px; font-weight: 800; color: #ffffff;
letter-spacing: 2px; text-align: center; margin-bottom: 4px;
}
.timer-sub { text-align: center; font-size: 11px; color: #5a5a72; margin-bottom: 12px; min-height: 16px; }

.hourly-box {
background-color: #0a0a0f;
border: 1px solid #2a2a38;
border-radius: 10px; padding: 10px 14px;
display: -webkit-flex; display: flex;
-webkit-align-items: center; align-items: center;
-webkit-justify-content: space-between; justify-content: space-between;
margin-bottom: 12px;
}
.hourly-label { font-size: 12px; color: #5a5a72; }
.hourly-val { font-size: 30px; font-weight: 800; color: #44aaff; letter-spacing: -1px; }
.hourly-unit { font-size: 13px; color: #5a5a72; margin-left: 4px; }

.btn-row { display: -webkit-flex; display: flex; gap: 8px; }
.btn-timer {
-webkit-flex: 1; flex: 1;
border: none; border-radius: 12px; padding: 14px 8px;
font-size: 14px; font-weight: 800;
cursor: pointer; -webkit-appearance: none; appearance: none;
}
.btn-start { background-color: #00aa77; color: #ffffff; }
.btn-pause { background-color: #cc4400; color: #ffffff; }
.btn-stop  { background-color: #252535; color: #e8e8f0; border: 1px solid #3a3a50; }

.manual-section {
margin-top: 12px; background-color: #0a0a0f;
border: 1px solid #2a2a38; border-radius: 10px; padding: 12px 14px;
}
.manual-label { font-size: 11px; color: #5a5a72; margin-bottom: 8px; }
.manual-row { display: -webkit-flex; display: flex; gap: 8px; -webkit-align-items: center; align-items: center; }
.time-input {
-webkit-flex: 1; flex: 1;
background-color: #111118; border: 1px solid #3a3a50;
border-radius: 8px; color: #e8e8f0; font-size: 15px;
padding: 9px 10px; text-align: center;
-webkit-appearance: none; appearance: none;
}
.btn-calc {
background-color: #1a5a99; color: #ffffff;
border: none; border-radius: 8px; padding: 9px 14px;
font-weight: 800; font-size: 13px; cursor: pointer;
white-space: nowrap; -webkit-appearance: none; appearance: none;
}
.calc-result { margin-top: 8px; font-size: 14px; font-weight: 700; color: #44aaff; text-align: center; min-height: 20px; }

.btn-record {
width: 100%; background-color: #009966; color: #ffffff;
border: none; border-radius: 14px; padding: 17px;
font-size: 16px; font-weight: 800; cursor: pointer;
letter-spacing: 1px; margin-top: 4px;
-webkit-appearance: none; appearance: none;
}

.log-list { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; gap: 10px; }
.log-item { background-color: #111118; border: 1px solid #2a2a38; border-radius: 12px; padding: 14px 16px; }
.log-item-header {
display: -webkit-flex; display: flex;
-webkit-justify-content: space-between; justify-content: space-between;
-webkit-align-items: center; align-items: center; margin-bottom: 8px;
}
.log-date { font-weight: 700; font-size: 14px; color: #e8e8f0; }
.log-total { font-size: 22px; font-weight: 800; color: #00dd99; letter-spacing: -1px; }
.log-details { font-size: 12px; color: #5a5a72; line-height: 1.8; }
.log-hourly { font-size: 13px; font-weight: 700; color: #44aaff; margin-top: 4px; }
.log-actions { display: -webkit-flex; display: flex; gap: 6px; margin-top: 10px; }
.btn-log-edit {
-webkit-flex: 1; flex: 1; border: none; border-radius: 8px; padding: 8px;
font-size: 13px; font-weight: 700; cursor: pointer;
background-color: #252535; color: #e8e8f0;
-webkit-appearance: none; appearance: none;
}
.btn-log-del {
-webkit-flex: 1; flex: 1; border: none; border-radius: 8px; padding: 8px;
font-size: 13px; font-weight: 700; cursor: pointer;
background-color: #3a1510; color: #ff7744;
-webkit-appearance: none; appearance: none;
}
.empty-log { text-align: center; color: #5a5a72; padding: 50px 20px; font-size: 14px; }

.modal-overlay {
display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
background-color: rgba(0,0,0,0.78); z-index: 200;
-webkit-align-items: flex-start; align-items: flex-start;
-webkit-justify-content: center; justify-content: center;
padding: 80px 20px 20px; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.modal-overlay.open { display: -webkit-flex; display: flex; }
.modal {
background-color: #16161f; border: 1px solid #2a2a38;
border-radius: 18px; padding: 22px; width: 100%; max-width: 360px;
-webkit-flex-shrink: 0; flex-shrink: 0;
}
.modal-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; color: #e8e8f0; }
.modal-field { margin-bottom: 14px; }
.modal-label { font-size: 11px; color: #5a5a72; margin-bottom: 6px; }
.modal-input {
width: 100%; background-color: #0a0a0f; border: 1px solid #3a3a50;
border-radius: 10px; color: #e8e8f0; font-size: 17px; padding: 11px 12px;
-webkit-appearance: none; appearance: none;
}
.modal-btns { display: -webkit-flex; display: flex; gap: 10px; margin-top: 18px; }
.btn-modal-cancel {
-webkit-flex: 1; flex: 1; background-color: #252535; color: #e8e8f0;
border: none; border-radius: 10px; padding: 13px; font-weight: 700; font-size: 14px;
cursor: pointer; -webkit-appearance: none; appearance: none;
}
.btn-modal-ok {
-webkit-flex: 2; flex: 2; background-color: #009966; color: #ffffff;
border: none; border-radius: 10px; padding: 13px; font-weight: 800; font-size: 14px;
cursor: pointer; -webkit-appearance: none; appearance: none;
}
.quick-btns {
display: -webkit-flex; display: flex; gap: 6px;
-webkit-flex-wrap: wrap; flex-wrap: wrap; margin-top: 8px;
}
.quick-btn {
background-color: #1e1e2a; border: 1px solid #3a3a50; border-radius: 8px;
color: #e8e8f0; font-size: 13px; font-weight: 700; padding: 6px 12px;
cursor: pointer; -webkit-appearance: none; appearance: none;
}

@-webkit-keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.pulse { -webkit-animation: pulse 1.5s ease-in-out infinite; animation: pulse 1.5s ease-in-out infinite; }
</style>

</head>
<body>

<div class="header">
  <div>
    <div class="header-title">🚗 配達メーター</div>
    <div class="header-date" id="headerDate"></div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('meter')">🏎 メーター</button>
  <button class="tab" onclick="switchTab('log')">📋 ログ</button>
</div>

<div class="screen active" id="screen-meter">
  <div class="meter-card">
    <div class="meter-row">
      <div class="service-dot" style="background-color:#06c167"></div>
      <div class="service-icon">🐸</div>
      <div class="service-name">Uber Eats</div>
      <div class="amount-display amt-uber" id="uberAmt" onclick="openAmountModal('uber')">¥0</div>
      <button class="btn-add" onclick="openDeliveryAdd('uber')">＋</button>
    </div>
    <div class="meter-row">
      <div class="service-dot" style="background-color:#e8380d"></div>
      <div class="service-icon">🍅</div>
      <div class="service-name">出前館</div>
      <div class="amount-display amt-demae" id="demaeAmt" onclick="openAmountModal('demae')">¥0</div>
      <button class="btn-add" onclick="openDeliveryAdd('demae')">＋</button>
    </div>
    <div class="meter-row">
      <div class="service-dot" style="background-color:#0a84ff"></div>
      <div class="service-icon">🚀</div>
      <div class="service-name">Rocket Now</div>
      <div class="amount-display amt-rocket" id="rocketAmt" onclick="openAmountModal('rocket')">¥0</div>
      <button class="btn-add" onclick="openDeliveryAdd('rocket')">＋</button>
    </div>
  </div>

  <div class="total-card">
    <div class="total-label">合計金額</div>
    <div class="total-amount"><span id="totalAmt">0</span><span class="total-yen">円</span></div>
  </div>

  <div class="timer-card">
    <div class="timer-header">
      <div class="timer-label">⏱ タイマー</div>
      <div class="timer-badge badge-stopped" id="timerBadge">停止中</div>
    </div>
    <div class="timer-display" id="timerDisplay">00:00:00</div>
    <div class="timer-sub" id="timerSub">スタートボタンで計測開始</div>
    <div class="hourly-box">
      <div class="hourly-label">現在の時給</div>
      <div>
        <span class="hourly-val" id="hourlyVal">——</span><span class="hourly-unit">円/h</span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-timer btn-start" id="btnStart" onclick="startTimer()">▶ スタート</button>
      <button class="btn-timer btn-pause" id="btnPause" onclick="pauseTimer()" style="display:none">⏸ 休憩</button>
      <button class="btn-timer btn-stop"  id="btnStop"  onclick="stopTimer()"  style="display:none">■ 終了</button>
    </div>
    <div class="manual-section">
      <div class="manual-label">📐 任意の時刻までの時給を計算</div>
      <div class="manual-row">
        <input type="time" class="time-input" id="manualEndTime">
        <button class="btn-calc" onclick="calcManualHourly()">計算</button>
      </div>
      <div class="calc-result" id="calcResult"></div>
    </div>
  </div>

<button class="btn-record" onclick="recordToday()">📝 本日の稼働を記録する</button>

</div>

<div class="screen" id="screen-log">
  <div class="log-list" id="logList"></div>
</div>

<!-- MODALS -->

<div class="modal-overlay" id="amountModal">
  <div class="modal">
    <div class="modal-title" id="amountModalTitle">合計金額を設定</div>
    <div class="modal-field">
      <div class="modal-label">金額（円）</div>
      <input type="number" inputmode="numeric" class="modal-input" id="amountInput" placeholder="0">
    </div>
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeModal('amountModal')">キャンセル</button>
      <button class="btn-modal-ok" onclick="setAmount()">設定する</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deliveryModal">
  <div class="modal">
    <div class="modal-title" id="deliveryModalTitle">配達報酬を追加</div>
    <div class="modal-field">
      <div class="modal-label">この配達の報酬（円）</div>
      <input type="number" inputmode="numeric" class="modal-input" id="deliveryInput" placeholder="0">
      <div class="quick-btns">
        <button class="quick-btn" onclick="addQuick(300)">+300</button>
        <button class="quick-btn" onclick="addQuick(400)">+400</button>
        <button class="quick-btn" onclick="addQuick(500)">+500</button>
        <button class="quick-btn" onclick="addQuick(600)">+600</button>
        <button class="quick-btn" onclick="addQuick(700)">+700</button>
        <button class="quick-btn" onclick="addQuick(800)">+800</button>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeModal('deliveryModal')">キャンセル</button>
      <button class="btn-modal-ok" onclick="addDelivery()">追加する</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title">ログを編集</div>
    <div class="modal-field">
      <div class="modal-label">日付</div>
      <input type="date" class="modal-input" id="editDate">
    </div>
    <div class="modal-field">
      <div class="modal-label">Uber Eats（円）</div>
      <input type="number" inputmode="numeric" class="modal-input" id="editUber">
    </div>
    <div class="modal-field">
      <div class="modal-label">出前館（円）</div>
      <input type="number" inputmode="numeric" class="modal-input" id="editDemae">
    </div>
    <div class="modal-field">
      <div class="modal-label">Rocket Now（円）</div>
      <input type="number" inputmode="numeric" class="modal-input" id="editRocket">
    </div>
    <div class="modal-field">
      <div class="modal-label">稼働時間（分）</div>
      <input type="number" inputmode="numeric" class="modal-input" id="editMinutes">
    </div>
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeModal('editModal')">キャンセル</button>
      <button class="btn-modal-ok" onclick="saveEdit()">保存する</button>
    </div>
  </div>
</div>

<script>
var state = {
  uber:0, demae:0, rocket:0,
  timer:{ status:'stopped', startTime:null, elapsed:0, runStart:null }
};
var currentService = null;
var editingLogIndex = -1;
var timerInterval = null;

function saveLogs(l){ try{localStorage.setItem('dlogs',JSON.stringify(l));}catch(e){} }
function loadLogs(){ try{return JSON.parse(localStorage.getItem('dlogs')||'[]');}catch(e){return[];} }
function saveState(){ try{localStorage.setItem('dstate',JSON.stringify(state));}catch(e){} }
function loadState(){
  try{
    var s=localStorage.getItem('dstate');
    if(!s) return;
    var d=JSON.parse(s);
    state.uber=d.uber||0; state.demae=d.demae||0; state.rocket=d.rocket||0;
    if(d.timer){
      state.timer.status=d.timer.status||'stopped';
      state.timer.elapsed=d.timer.elapsed||0;
      state.timer.startTime=d.timer.startTime||null;
      state.timer.runStart=d.timer.runStart||null;
    }
  }catch(e){}
}

function pad(n){ return n<10?'0'+n:''+n; }

function init(){
  loadState();
  var now=new Date();
  var days=['日','月','火','水','木','金','土'];
  document.getElementById('headerDate').textContent=
    now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日（'+days[now.getDay()]+'）';
  renderAmounts();
  renderLog();
  if(state.timer.status==='running'){ startTimerTick(); showRunning(); }
  else if(state.timer.status==='paused'){ showPaused(); }
  else{ showStopped(); }
  updateTimerDisplay();
  updateHourly();
}

function renderAmounts(){
  document.getElementById('uberAmt').textContent='¥'+state.uber.toLocaleString();
  document.getElementById('demaeAmt').textContent='¥'+state.demae.toLocaleString();
  document.getElementById('rocketAmt').textContent='¥'+state.rocket.toLocaleString();
  document.getElementById('totalAmt').textContent=(state.uber+state.demae+state.rocket).toLocaleString();
  updateHourly();
}

function openAmountModal(svc){
  currentService=svc;
  var n={uber:'Uber Eats',demae:'出前館',rocket:'Rocket Now'};
  document.getElementById('amountModalTitle').textContent=n[svc]+' — 合計金額を設定';
  document.getElementById('amountInput').value=state[svc]||'';
  document.getElementById('amountModal').classList.add('open');
}
function setAmount(){
  state[currentService]=parseInt(document.getElementById('amountInput').value)||0;
  saveState(); renderAmounts(); closeModal('amountModal');
}
function openDeliveryAdd(svc){
  currentService=svc;
  var n={uber:'Uber Eats',demae:'出前館',rocket:'Rocket Now'};
  document.getElementById('deliveryModalTitle').textContent=n[svc]+' — 配達を追加';
  document.getElementById('deliveryInput').value='';
  document.getElementById('deliveryModal').classList.add('open');
}
function addQuick(amt){
  var v=parseInt(document.getElementById('deliveryInput').value)||0;
  document.getElementById('deliveryInput').value=v+amt;
}
function addDelivery(){
  state[currentService]=(state[currentService]||0)+(parseInt(document.getElementById('deliveryInput').value)||0);
  saveState(); renderAmounts(); closeModal('deliveryModal');
}

function getElapsedMs(){
  var t=state.timer.elapsed||0;
  if(state.timer.status==='running'&&state.timer.runStart) t+=Date.now()-state.timer.runStart;
  return t;
}
function formatTime(ms){
  var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
  return pad(h)+':'+pad(m)+':'+pad(sc);
}
function updateTimerDisplay(){
  var ms=getElapsedMs();
  document.getElementById('timerDisplay').textContent=formatTime(ms);
  var mins=Math.floor(ms/60000);
  document.getElementById('timerSub').textContent=
    mins>0?(Math.floor(mins/60)+'時間'+mins%60+'分 稼働中'):
    (state.timer.status==='stopped'?'スタートボタンで計測開始':'計測中...');
}
function updateHourly(){
  var ms=getElapsedMs(), h=ms/3600000, total=state.uber+state.demae+state.rocket;
  document.getElementById('hourlyVal').textContent=
    (h<0.01||total===0)?'——':Math.round(total/h).toLocaleString();
}
function startTimerTick(){
  clearInterval(timerInterval);
  timerInterval=setInterval(function(){ updateTimerDisplay(); updateHourly(); },10000);
  updateTimerDisplay(); updateHourly();
}
function showRunning(){
  document.getElementById('btnStart').style.display='none';
  document.getElementById('btnPause').style.display='';
  document.getElementById('btnStop').style.display='';
  var b=document.getElementById('timerBadge');
  b.textContent='稼働中'; b.className='timer-badge badge-running pulse';
}
function showPaused(){
  document.getElementById('btnStart').style.display='';
  document.getElementById('btnStart').textContent='▶ 再開';
  document.getElementById('btnPause').style.display='none';
  document.getElementById('btnStop').style.display='';
  var b=document.getElementById('timerBadge');
  b.textContent='休憩中'; b.className='timer-badge badge-paused pulse';
}
function showStopped(){
  document.getElementById('btnStart').style.display='';
  document.getElementById('btnStart').textContent='▶ スタート';
  document.getElementById('btnPause').style.display='none';
  document.getElementById('btnStop').style.display='none';
  var b=document.getElementById('timerBadge');
  b.textContent='停止中'; b.className='timer-badge badge-stopped';
}
function startTimer(){
  if(state.timer.status==='stopped'){ state.timer.elapsed=0; state.timer.startTime=Date.now(); }
  state.timer.status='running'; state.timer.runStart=Date.now();
  saveState(); startTimerTick(); showRunning();
}
function pauseTimer(){
  if(state.timer.status!=='running') return;
  state.timer.elapsed=(state.timer.elapsed||0)+(Date.now()-state.timer.runStart);
  state.timer.runStart=null; state.timer.status='paused';
  clearInterval(timerInterval); saveState(); updateTimerDisplay(); updateHourly(); showPaused();
}
function stopTimer(){
  if(state.timer.status==='running')
    state.timer.elapsed=(state.timer.elapsed||0)+(Date.now()-state.timer.runStart);
  state.timer.runStart=null; state.timer.status='stopped';
  clearInterval(timerInterval); saveState(); updateTimerDisplay(); updateHourly(); showStopped();
}
function calcManualHourly(){
  var val=document.getElementById('manualEndTime').value;
  if(!val||state.timer.status==='stopped'||!state.timer.startTime){
    document.getElementById('calcResult').textContent='先にタイマーをスタートしてください'; return;
  }
  var now=new Date(), p=val.split(':');
  var end=new Date(now.getFullYear(),now.getMonth(),now.getDate(),parseInt(p[0]),parseInt(p[1]),0);
  var totalMs=Math.max(end.getTime()-state.timer.startTime,0);
  var h=totalMs/3600000, total=state.uber+state.demae+state.rocket;
  if(h<0.01){ document.getElementById('calcResult').textContent='終了時刻が開始より前です'; return; }
  document.getElementById('calcResult').textContent=
    val+'まで → '+Math.round(total/h).toLocaleString()+'円/h ('+Math.floor(totalMs/3600000)+'h'+Math.floor((totalMs%3600000)/60000)+'m)';
}

function recordToday(){
  var total=state.uber+state.demae+state.rocket, ms=getElapsedMs();
  if(total===0&&ms===0){ alert('金額または稼働時間を入力してください'); return; }
  var now=new Date();
  var dateStr=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  var mins=Math.floor(ms/60000), logs=loadLogs(), idx=-1;
  for(var i=0;i<logs.length;i++){ if(logs[i].date===dateStr){idx=i;break;} }
  var entry={date:dateStr,uber:state.uber,demae:state.demae,rocket:state.rocket,total:total,minutes:mins};
  if(idx>=0){ if(!confirm('同じ日の記録があります。上書きしますか？')) return; logs[idx]=entry; }
  else { logs.unshift(entry); }
  saveLogs(logs);
  state.uber=0; state.demae=0; state.rocket=0;
  state.timer={status:'stopped',startTime:null,elapsed:0,runStart:null};
  clearInterval(timerInterval); saveState();
  renderAmounts(); updateTimerDisplay(); updateHourly(); showStopped(); renderLog();
  alert('記録しました！');
}

function renderLog(){
  var logs=loadLogs(), container=document.getElementById('logList');
  if(!logs.length){ container.innerHTML='<div class="empty-log">まだ記録がありません</div>'; return; }
  var html='';
  for(var i=0;i<logs.length;i++){
    var l=logs[i], h=l.minutes?(l.minutes/60):0;
    var hourly=h>0.01?Math.round(l.total/h):null;
    var hh=Math.floor(l.minutes/60), mm=l.minutes%60;
    html+='<div class="log-item">';
    html+='<div class="log-item-header"><div class="log-date">'+formatDate(l.date)+'</div>';
    html+='<div class="log-total">¥'+l.total.toLocaleString()+'</div></div>';
    html+='<div class="log-details">🐸 '+l.uber.toLocaleString()+'円　🍅 '+l.demae.toLocaleString()+'円　🚀 '+l.rocket.toLocaleString()+'円<br>⏱ '+hh+'時間'+mm+'分</div>';
    if(hourly) html+='<div class="log-hourly">時給: '+hourly.toLocaleString()+'円/h</div>';
    html+='<div class="log-actions">';
    html+='<button class="btn-log-edit" onclick="openEdit('+i+')">✏️ 編集</button>';
    html+='<button class="btn-log-del" onclick="deleteLog('+i+')">🗑 削除</button>';
    html+='</div></div>';
  }
  container.innerHTML=html;
}
function formatDate(str){
  var p=str.split('-'), d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  var days=['日','月','火','水','木','金','土'];
  return p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日（'+days[d.getDay()]+'）';
}
function openEdit(i){
  editingLogIndex=i;
  var l=loadLogs()[i];
  document.getElementById('editDate').value=l.date;
  document.getElementById('editUber').value=l.uber;
  document.getElementById('editDemae').value=l.demae;
  document.getElementById('editRocket').value=l.rocket;
  document.getElementById('editMinutes').value=l.minutes;
  document.getElementById('editModal').classList.add('open');
}
function saveEdit(){
  var logs=loadLogs();
  var u=parseInt(document.getElementById('editUber').value)||0;
  var d=parseInt(document.getElementById('editDemae').value)||0;
  var r=parseInt(document.getElementById('editRocket').value)||0;
  logs[editingLogIndex]={
    date:document.getElementById('editDate').value,
    uber:u, demae:d, rocket:r, total:u+d+r,
    minutes:parseInt(document.getElementById('editMinutes').value)||0
  };
  saveLogs(logs); renderLog(); closeModal('editModal');
}
function deleteLog(i){
  if(!confirm('この記録を削除しますか？')) return;
  var logs=loadLogs(); logs.splice(i,1); saveLogs(logs); renderLog();
}

function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function switchTab(tab){
  var tabs=document.querySelectorAll('.tab');
  tabs[0].className='tab'+(tab==='meter'?' active':'');
  tabs[1].className='tab'+(tab==='log'?' active':'');
  document.getElementById('screen-meter').className='screen'+(tab==='meter'?' active':'');
  document.getElementById('screen-log').className='screen'+(tab==='log'?' active':'');
  if(tab==='log') renderLog();
}

var ovs=document.querySelectorAll('.modal-overlay');
for(var i=0;i<ovs.length;i++){
  (function(el){ el.addEventListener('click',function(e){ if(e.target===el) el.classList.remove('open'); }); })(ovs[i]);
}

init();
</script>

</body>
</html>
